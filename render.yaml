services:
  - type: web
    name: boytags-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma generate
    # Supabase pauses the project when idle, so the first push attempt usually fails and the app
    # would otherwise start against a stale schema (every order write then 500s). Retry once the
    # sleeping database has had time to wake.
    preDeployCommand: npx prisma migrate deploy || npx prisma db push || (echo "Retrying prisma db push after database wake-up..." && sleep 25 && npx prisma db push) || echo "Schema push deferred: the app started without syncing the schema."
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
